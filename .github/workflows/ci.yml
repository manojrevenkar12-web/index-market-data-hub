name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: quick market, every design, store, API, EOD job, invariants
        run: python -m pytest
      - name: development market evaluated again gives the committed reports
        run: |
          python -m imdh.eval.cli evaluate
          git diff --exit-code reports/dev.json reports/charts
      - name: the hub passes its gate and the README matches the reports
        run: python -m imdh.eval.cli gate && python -m imdh.eval.cli readme --check

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: imdh}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IMDH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/imdh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: the bitemporal store on PostgreSQL 16
        run: python -m pytest tests/test_store.py
      - name: a whole quarter loaded into PostgreSQL
        run: python -m imdh.eval.load --url "$IMDH_TEST_DATABASE_URL"

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r ../requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: dashboard end to end, with axe
        run: pnpm e2e

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: one image for the API and the end-of-day job
        run: docker build -t imdh:ci .
      - name: the image starts and answers
        run: |
          docker run -d --name hub -p 8080:8080 -e IMDH_DATABASE_URL=sqlite:////tmp/hub.db imdh:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && exit 0; sleep 1; done
          docker logs hub; exit 1
